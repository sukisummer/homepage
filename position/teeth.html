<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Weapon Locker</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body class="room-page tooth-page">
        <a class="return-face" href="index.html">Return to Face</a>

        <header class="room-heading">
            <p class="room-number">TEETH / WEAPON COLLECTION</p>
            <h1>My Weapon Locker</h1>
            <p>Each tooth holds one of my favorite weapons from Splatoon.</p>
        </header>

        <main class="tooth-grid">
            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-1" src="p/1.png" alt="Bloblobber">
                </div>
                <span>TOOTH 01</span>
                <h2>Bloblobber</h2>
            </article>

            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-2" src="p/2.png" alt="Tentatek Splattershot">
                </div>
                <span>TOOTH 02</span>
                <h2>Tentatek Splattershot</h2>
            </article>

            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-3" src="p/3.png" alt="Splattershot">
                </div>
                <span>TOOTH 03</span>
                <h2>Splattershot</h2>
            </article>

            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-4" src="p/4.png" alt=".52 Gal">
                </div>
                <span>TOOTH 04</span>
                <h2>.52 Gal</h2>
            </article>

            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-5" src="p/5.png" alt="Squeezer">
                </div>
                <span>TOOTH 05</span>
                <h2>Squeezer</h2>
            </article>

            <article class="weapon-card">
                <div class="weapon-frame">
                    <img class="weapon-image weapon-6" src="p/6.png" alt="N-ZAP '85">
                </div>
                <span>TOOTH 06</span>
                <h2>N-ZAP '85</h2>
            </article>
        </main>

        <nav class="room-nav">
            <a href="mouth.html">Return to the Mouth</a>
            <a href="tongue.html">Visit the Tongue</a>
        </nav>
    </body>
</html>
